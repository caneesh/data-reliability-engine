# Engine-wide defaults (spec section 3). Synthetic sample: real values live with
# the deployed instance. Settings resolve defaults.yaml, then the feed, then the
# dataset; a value set lower wins.

dq_database: dq
environment: dev
timezone: America/Chicago    # time columns are read in this zone unless they set their own
hmac_secret_file: null        # absolute path to a protected file; never commit the secret

retention_months:             # spec section 5: results and events 7 years, file registry 13 months
  dq_run: 84
  dq_check_result: 84
  dq_cause_result: 84
  dq_key_event: 84
  dq_file: 13
  dq_partition_state: 13      # release 4: partition states (T1_PARTITION_DRIFT)
  dq_commit: 84               # ADR-07: at least as long as every table it gates (results, events, partition states)
  dq_integrity: 84            # checkpoint 2 corrections: integrity sweeps and incidents
  dq_reconciliation: 84       # build step 3: HOP_LEDGER's accounting (evidence of its results)

recipients:                   # feed owner -> email addresses (spec section 8)
  membership-gold: [dre-alerts@example.com]
  provider-data: [provider-data-alerts@example.com]
email:                        # mail relay for the digest; not yet confirmed (spec section 11):
  smtp_host: null             # null: digests are built but not sent
  smtp_port: 25
  sender: null
  all_clear_digest: every_run # every_run | daily (the run in the hour from rule_run_at) | never

# Settings
sla_hours: 8
email_sample_keys: false
min_rows_per_load: 1
volume_tolerance_pct: 50
compute_budget_minutes: 8
full_sweep_day: SUNDAY
settle_minutes: 15            # a window ends this long before the run starts
initial_lookback_hours: 24    # a dataset's first window covers this many hours
max_window_hours: 72          # a window held by PLATFORM or BUDGET problems is released after this long
rule_run_at: "06:00"          # daily gold rules run at the first run at or after this time; weekly ones on full_sweep_day
rule_weekly_day: null         # weekly gold rules' day; null: each dataset's full_sweep_day
watchdog_grace_minutes: 30    # dre watchdog expects each hour's run to have started (and finished) this long after the hour
commit_batch: 25              # ADR-07: evaluations and investigations published per append of commit rows (1 to 1000)
integrity_sweep_days: 35      # the daily integrity sweep checks this many days of commits against the store
integrity_full_sweep_day: SUNDAY  # and every commit whose evidence is still kept, once a week (null: never)
retention_holds: []           # investigation holds: [{from: 2026-01-01, to: 2026-01-31, reason: "...", until: 2026-12-31}]
investigation_retry_days: 7   # each NORMAL run retries cause investigations left unfinished this far back
history_lookback_days: 400    # how far back (run_date) the hourly reads of the dq store look; must cover max_window_hours and investigation_retry_days
watchdog_owner: null          # whose recipients get watchdog alerts; null: every address in recipients
compute_budget_scope: check   # check: each check gets compute_budget_minutes; dataset: a dataset's checks share it
scan_mb_per_minute: null      # cluster throughput; set it to refuse checks whose estimated scan exceeds the budget
run_budget_minutes: 40        # ADR-08: a NORMAL run's checks share this; one reached after it is DID_NOT_RUN / run_budget_exceeded
kill_switch_file: null        # ADR-08: absolute path whose presence stops runs between checks (a deployment value, not yet named)
backpressure_share: 0.8       # ADR-08: after a NORMAL run longer than this share of the run budget, the weekly full sweep is deferred
