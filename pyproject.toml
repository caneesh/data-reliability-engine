[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hcsc-datalake-dre"
description = "Data Reliability Engine: read-only data quality checks for the data lake"
readme = "README.md"
requires-python = ">=3.10"
dynamic = ["version"]
dependencies = [
    "pyspark==3.5.1",
    "pydantic>=2,<3",
    "PyYAML>=6",
    "Jinja2>=3.1",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
dre = "hcsc.datalake.dre.cli:main"

[tool.setuptools.dynamic]
version = { attr = "hcsc.datalake.dre.__version__" }

[tool.setuptools.packages.find]
where = ["src"]
include = ["hcsc.datalake.dre*"]
namespaces = true

[tool.setuptools.package-data]
"hcsc.datalake.dre" = ["patterns/*.yaml", "checks/sql/*.j2", "store/*.sql", "notify/*.j2"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
